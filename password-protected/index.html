      <!-- START PASSWORD PROTECTED SECTION -->
      <section id="password-protected" class="placeholder-page">
        <div class="row justify-content-center" data-aos="fade-up">
          <div class="col-12 col-md-auto placeholder-copy">

            <!-- blurb -->
            <h2 class="small-vanilla-header">Password protected &#128272;</h2>
            <p class="meta-data">This case study contains confidential business information.</p>

            <!-- password form -->
            <form id="password-form" class="mt-5 mb-5" novalidate>
              <label for="password" class="eyebrow-header">Password</label>
              <div class="form-inline">
                <input type="password" class="form-control password-input" id="password" autocomplete="current-password">
                <button type="submit" class="btn password-btn">Submit</button>
                <div class="invalid-feedback">Hmm, nice try. &#128071;</div>
              </div>
            </form>

            <!-- email -->
            <p class="meta-data mb-2">Email for me access, so I don’t get in trouble:</p>
            <p><a class="butt text-link" id="email-me" data-toggle="tooltip" data-placement="top" data-clipboard-text="brittanyroberts.design@gmail.com">brittanyroberts.design@gmail.com</a></p>
          </div>
        </div>
      </section>
      <!-- END PASSWORD PROTECTED SECTION -->

    <!-- START FOOTER -->

     <div class="row no-gutters squeeze justify-content-around">

        </div>

        <!-- righthand cat -->
        <div class="col-md-3 cats order-3">
          <img src="../resources/images/bud-side-small.png" id="bud" title="Bud" class="img-fluid" alt="Fluffy black cat, lying next to houseplants" srcset="../resources/images/bud-side.png, ../resources/images/bud-side-large.png" data-placement="top" data-aos="fade-left" data-aos-duration="2000">

      <!-- plywood floor pattern -->
      <div id="floor" class="row"></div>
      </footer>

        <!-- END CONTAINER -->
      </div>

    <script>

      AOS.init({
        duration: 1300
      });

    var clipboard = new ClipboardJS('.butt');

    $('#email-me').tooltip({title: "Copy 'brittanyroberts.design@gmail.com'", trigger: 'hover focus'});

    $('#bud').tooltip({title: "Bud", trigger: 'hover focus'});
    $('#rocket').tooltip({title: "Rocket", trigger: 'hover focus'});

    clipboard.on('success', function(e) {
      $('#email-me').tooltip('dispose').tooltip({
        title: "Copied!",
        trigger: "click",
      }).tooltip('show');
    });

    $(document).on('show.bs.tooltip', function (e) {
      setTimeout(function() {
        $('#email-me').tooltip('hide');
      }, 4000);
    });

    // no real password yet -- nudge people to email instead
    $('#password-form').on('submit', function(e) {
      e.preventDefault();
      $('#password').addClass('is-invalid');
    });

    $('#password').on('input', function() {
      $(this).removeClass('is-invalid');
    });

    </script>
